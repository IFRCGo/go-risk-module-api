app:
  environment: PROD
  nameOverride: ifrcgo-risk-module

  appTypeEnvName: "DJANGO_APP_TYPE"

  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["gunicorn", "risk_module.wsgi:application", "--bind", "0.0.0.0:80"]
    ingress:
      enabled: true
      className:
      host:
    probes:
      # banjo-utils HealthProbeMiddleware serves /healthz/live/ and /healthz/ready/.
      # Chart defaults (liveness /healthz/live/, readiness+startup /healthz/ready/) apply.
      enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 2Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - celery
        - --app=risk_module
        - worker
        - --loglevel=INFO
      # banjo-celery-probe heartbeat wiring (writer via setup_worker_heartbeat,
      # reader via banjo-celery-probe) on a RAM emptyDir.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 2Gi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs: ["--queues=celery", "--max-tasks-per-child=20"]
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
    addons:
      beat:
        enabled: true
        command:
          - celery
          - --app=risk_module
          - beat
          - --loglevel=info
          - --scheduler=banjo_utils.celery_health.database.HeartbeatDatabaseScheduler
        strategy: {type: Recreate}
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # --max-age must exceed beat's persistent-scheduler tick (300s)
            exec: {command: [banjo-celery-probe, --max-age, "360"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "0.1"
            memory: 0.2Gi
          limits:
            cpu: "1"
            memory: 0.5Gi

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 1Gi
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults verbatim
      # (Sync hook @ wave 20, `manage.py migrate` / `collectstatic --noinput`).
      # Only wait-for-resources overrides the default (bare) command.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache"]

  env:
    # Application info
    RISK_RELEASE: "{{ $.Values.image.tag }}"
    RISK_ENVIRONMENT: "{{ $.Values.environment }}"
    RISK_API_FQDN: "{{ required \".app.env.RISK_API_FQDN\" nil }}"
    # Django configs
    DJANGO_DEBUG: "false"
    DJANGO_TIME_ZONE: UTC
    DJANGO_ALLOWED_HOSTS: "*"
    TIME_ZONE: "UTC"
    # Sentry
    SENTRY_TRACE_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
    # Logging
    APPS_LOGGING_LEVEL: "WARNING"

  secrets: {}
    # DJANGO_SECRET_KEY:
    # # Sentry
    # SENTRY_DSN:
    # # PDC
    # PDC_USERNAME:
    # PDC_PASSWORD:
    # PDC_ACCESS_TOKEN:
    # # Meteoswiss
    # METEOSWISS_S3_ENDPOINT_URL:
    # METEOSWISS_S3_BUCKET:
    # METEOSWISS_S3_ACCESS_KEY:
    # METEOSWISS_S3_SECRET_KEY:
