app:
  api:
    ingress:
      enabled: true

  env:
    # Sentry
    SENTRY_TRACE_SAMPLE_RATE: "0.8"
    SENTRY_PROFILE_SAMPLE_RATE: "0.8"

  # NOTE: DB/S3/cache connection secrets are supplied by the user
  # (e.g. secretFromEnv / extraSecretsName) alongside the external deps.

  hooks:
    jobs:
      # NOTE: Make sure keys are lowercase
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--minio"]
      create-users:
        enabled: true
        jobAnnotations:
          argocd.argoproj.io/hook: "Sync"
          argocd.argoproj.io/sync-wave: "25"
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        # extraEnv:
        #   ADMIN_USER_EMAIL_PASSWORD_SET: "IFRC:Admin:ifrc-admin:admin@ifrc.org:password_hash"
        # Script mounted as a file (per-job ConfigMap) and piped into the shell.
        command: ["sh", "-c", "./manage.py shell < /etc/hook-files/create_users.py"]
        files:
          create_users.py: |
            import os
            from django.contrib.auth import get_user_model
            from django.db import transaction

            User = get_user_model()

            user_credentials = [
                user_credential.split(":")
                for user_credential in os.environ["ADMIN_USER_EMAIL_PASSWORD_SET"].split(",")
            ]

            print("Parsed provided credentials:", user_credentials)

            @transaction.atomic
            def create_initial_users(user_credentials):
                for first_name, last_name, username, email, password_hash in user_credentials:
                    user, created = User.objects.update_or_create(
                        email=email,
                        username=username,
                        defaults={
                            "first_name": first_name,
                            "last_name": last_name,
                            "password": password_hash,
                            "is_superuser": True,
                            "is_staff": True,
                        },
                    )
                    action = "created" if created else "updated"
                    print(f"Successfully {action} user({email=})")

            create_initial_users(user_credentials)
