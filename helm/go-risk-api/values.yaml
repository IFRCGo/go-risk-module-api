environment: test

image:
  repository: ghcr.io/ifrcgo/go-risk-module-api
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

env:
  APPS_LOGGING_LEVEL: "WARNING"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_DEBUG: ""
  METEOSWISS_S3_BUCKET: ""
  METEOSWISS_S3_ENDPOINT_URL: ""
  RISK_API_FQDN: ""
  SENTRY_TRACE_SAMPLE_RATE: "0.2"
  SENTRY_PROFILE_SAMPLE_RATE: "0.2"
  TIMEZONE: "UTC"

appSecret:
  name: ""
  keys:
    - DATABASE_PASSWORD
    - DJANGO_SECRET_KEY
    - METEOSWISS_S3_BUCKET
    - METEOSWISS_S3_ENDPOINT_URL
    - METEOSWISS_S3_ACCESS_KEY
    - METEOSWISS_S3_BUCKET
    - METEOSWISS_S3_SECRET_KEY
    - PDC_ACCESS_TOKEN
    - PDC_PASSWORD
    - PDC_USERNAME

api:
  ingress:
    enabled: false
    host:
  enabled: true
  containerPort: 9001
  replicaCount: 1
  resources: {}

celery:
  resources: {}

celeryBeat:
  resources: {}

# Subchart configuration
postgresql:
  enabled: true
  fullnameOverride: ""

redis:
  enabled: true
  auth:
    enabled: false
  architecture: standalone
  replica:
    replicaCount: 0

# Global configurations are required for consistency across the chart and its subcharts
global:
  postgresql:
    auth:
      username: ""
      database: ""
      existingSecret: "<insert_application_secret_name_here"
      secretKeys:
        userPasswordKey: DATABASE_PASSWORD
        adminPasswordKey: DATABASE_PASSWORD
    service:
      ports:
        postgresql: 5432

# Connection parameters for external PostgreSQL database
externalDatabase:
  host: ""
  port: 5432
  auth:
    username:
    database:
    existingSecret:
    secretKeys:
      userPasswordKey:

# Connection parameters for external Redis
#externalRedis:
#  host: ""
#  port: 6379

azure:
  aksSecretsProviderAvailable: false
  keyvault:
    name: ""
    clientId: ""
    tenantId: ""

serviceAccount:
  # Specifies whether a service account should be created
  # Required when using workload identity to access Azure Key Vault Secrets
  create: false
  automount: true
  annotations:
    azure.workload.identity/client-id : "<workload_identity_client_id>"
  labels:
    azure.workload.identity/use: "true"
  name: ""