{{- if .Values.api.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ifrcgo-risk-module.fullname" . }}-ingress
  labels:
    app.kubernetes.io/name: {{ include "ifrcgo-risk-module.fullname" . }}
    app.kubernetes.io/component: {{ include "ifrcgo-risk-module.fullname" . }}-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - host: {{ required "api.ingress.host" .Values.api.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "ifrcgo-risk-module.fullname" . }}-api-svc
            port:
              number: 80

{{- end }}