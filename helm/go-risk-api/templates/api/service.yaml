{{- if .Values.api.enabled -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "application.fullname" .}}-api-svc
  labels:
    app.kubernetes.io/name: {{ include "application.fullname" . }}
    app.kubernetes.io/component: {{ include "application.fullname" . }}-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "application.fullname" . }}
    app.kubernetes.io/component: {{ include "application.fullname" . }}-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.api.containerPort }}

{{- end }}