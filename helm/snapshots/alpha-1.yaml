# Hook: create-users
apiVersion: batch/v1
kind: Job
metadata:
  name: risk-1-create-users
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    metadata:
      annotations:
        checksum/secret: a5d73225a01c3e24b1530c338a0a44cf07ab77dc8646dc0562caada4bbc1b61f
        checksum/configmap: f00be2c6cf51cc19c80358f167f85af68caa5a8c2405a310fc0fab05dfb0a0c8
      labels:
        app: risk-1
        component: argo-hooks
    spec:
      restartPolicy: "Never"
      containers:
        - name: create-users
          image: "local.git.com/ifrcgo/risk:develop.xxxxxxxx"
          imagePullPolicy: IfNotPresent
          command: 
            - ./manage.py
            - shell
            - -c
            - |
              import os;
              from django.contrib.auth import get_user_model;
              from django.db import transaction;
            
              User = get_user_model()
            
              user_credentials = [
                user_credential.split(":")
                for user_credential in os.environ["ADMIN_USER_EMAIL_PASSWORD_SET"].split(",")
              ];
            
              print("Parsed provided credentials:", user_credentials);
            
              @transaction.atomic
              def create_initial_users(user_credentials):
                  for first_name, last_name, username, email, password_hash in user_credentials:
                      user, created = User.objects.update_or_create(
                          email=email,
                          username=username,
                          defaults={
                            "first_name": first_name,
                            "last_name": last_name,
                            "password": password_hash,
                            "is_superuser": True,
                            "is_staff": True,
                          },
                      )
                      action = "updated"
                      if created:
                        action = "created"
                      print(f"Successfully {action} user({email=})");
              create_initial_users(user_credentials);
          resources:
            limits:
              cpu: "4"
              memory: 1Gi
            requests:
              cpu: "0.1"
              memory: 1Gi
          envFrom:
            - secretRef:
                name: risk-1-secret
            - configMapRef:
                name: risk-1-env-name
          env:
            - name: DJANGO_APP_TYPE
              value: "hook"
            - name: CACHE_REDIS_URL
              value: redis://risk-module-dragonfly:6379/0
            - name: CELERY_REDIS_URL
              value: redis://risk-module-dragonfly:6379/1
            - name: ADMIN_USER_EMAIL_PASSWORD_SET
              value: "IFRC:Admin:admin@ifrc.org:password_hash"
